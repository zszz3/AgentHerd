name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: "true"

jobs:
  dws-windows-write:
    name: DingTalk native write comparison
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Compare direct and host-adapter writes with the released x64 binary
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'dws-windows-amd64.zip'
          Invoke-WebRequest 'https://github.com/DingTalk-Real-AI/dingtalk-workspace-cli/releases/download/v1.0.69/dws-windows-amd64.zip' -OutFile $zip
          if ((Get-FileHash $zip).Hash -ne '9684b525e836943f41ea6ca03404b2221a25c6ebe63f569487bd06b732574b48') { throw 'Unexpected archive digest' }
          Expand-Archive -LiteralPath $zip -DestinationPath 'apps/desktop/dws'
          node scripts/dws-windows-write-smoke.mjs

  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check Policy-Sync mirror
        run: |
          node -e '
            const fs = require("node:fs");
            const sync = (f) => fs.readFileSync(f, "utf8").match(/^Policy-Sync:\s*(.+)$/m)?.[1]?.trim();
            const a = sync("AGENTS.md"), c = sync("CLAUDE.md");
            if (!a || a !== c) {
              console.error(`Policy-Sync mismatch: AGENTS.md=${a} vs CLAUDE.md=${c}`);
              process.exit(1);
            }
          '
      - name: Lint and typecheck
        run: pnpm check

  test-build:
    name: Test & Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Cache Electron binary
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/electron-cache
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Smoke test the documented desktop start from a missing Electron binary
        if: runner.os == 'Windows'
        timeout-minutes: 6
        shell: pwsh
        env:
          electron_config_cache: ${{ runner.temp }}/electron-cache
        run: ./scripts/windows-desktop-smoke.ps1
      - name: Install Electron binary
        env:
          electron_config_cache: ${{ runner.temp }}/electron-cache
        run: node apps/desktop/node_modules/electron/install.js
      - name: Run tests
        run: pnpm test
      - name: Stage the pinned DingTalk Workspace CLI
        if: runner.os == 'Windows'
        run: pnpm --filter @agentherd/desktop fetch-dws
      - name: Build desktop app
        if: runner.os == 'Windows'
        run: pnpm --filter @agentherd/desktop build
      - name: Build unsigned Windows x64 internal installer
        if: runner.os == 'Windows' && github.event_name == 'pull_request'
        run: node apps/desktop/scripts/package-windows.mjs
      - name: Install and start the Windows candidate in a disposable profile
        if: runner.os == 'Windows' && github.event_name == 'pull_request'
        shell: pwsh
        run: ./scripts/windows-candidate-smoke.ps1 -Installer 'dist/windows/AgentHerd-Setup-x64.exe'
      - name: Record the tested installer digest
        if: runner.os == 'Windows' && github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $file = 'dist/windows/AgentHerd-Setup-x64.exe'
          $digest = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  AgentHerd-Setup-x64.exe" | Set-Content -LiteralPath "$file.sha256" -Encoding ascii
          "Unsigned Windows x64 internal candidate SHA-256: $digest" >> $env:GITHUB_STEP_SUMMARY
      - name: Upload tested internal installer (not a signed release)
        if: runner.os == 'Windows' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: AgentHerd-Windows-x64-unsigned-pr-${{ github.event.number }}-${{ github.run_attempt }}
          path: |
            dist/windows/AgentHerd-Setup-x64.exe
            dist/windows/AgentHerd-Setup-x64.exe.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Package macOS app and verify the bundled DingTalk CLI
        if: runner.os == 'macOS'
        run: |
          pnpm --filter @agentherd/desktop package:mac
          app="apps/desktop/release/mac-$(node -p 'process.arch')/AgentHerd.app"
          dws="$app/Contents/Resources/dws/dws"
          # Establish that the bundle is sealed before running any bundled code.
          codesign --verify --deep --strict --verbose=2 "$app"
          "$dws" --version | grep -E '^dws version v1\.0\.69( |$)'
          codesign --verify --strict --verbose=2 "$dws"
          codesign --verify --deep --strict --verbose=2 "$app"
